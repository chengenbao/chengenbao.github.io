<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 8 8">
  <!-- white square background -->
  <rect x="0" y="0" width="8" height="8" fill="#ffffff" stroke="#333" stroke-width="0.08"/>
  <!-- corner black triangles (legs length 2) -->
  <polygon points="0,0 2,0 0,2" fill="#222"/>
  <polygon points="8,0 6,0 8,2" fill="#222"/>
  <polygon points="8,8 6,8 8,6" fill="#222"/>
  <polygon points="0,8 2,8 0,6" fill="#222"/>
  <!-- central black diamond, side 2*sqrt(2): vertices at (4,6),(2,4),(4,2),(6,4) -->
  <polygon points="4,6 2,4 4,2 6,4" fill="#222"/>
  <!-- coin sample location -->
  <circle cx="2.6" cy="3.31" r="0.5" fill="none" stroke="#888" stroke-width="0.05"/>
  <text x="4" y="4.5" font-size="0.5" text-anchor="middle" fill="#888">coin</text>
</svg>
