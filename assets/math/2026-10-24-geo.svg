<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" width="360" height="200">
  <!-- Large semicircle (radius 100, centered at O=(180,170)) -->
  <path d="M 80 170 A 100 100 0 0 1 280 170 Z" fill="#cfe8ff" stroke="#1565c0" stroke-width="2"/>
  <!-- Diameter AB -->
  <line x1="80" y1="170" x2="280" y2="170" stroke="#1565c0" stroke-width="2"/>
  <!-- Chord CD (length 160 scaled, at height h=60 above AB) -->
  <line x1="100" y1="110" x2="260" y2="110" stroke="#d84315" stroke-width="2.5"/>
  <text x="92" y="104" font-family="serif" font-size="13" fill="#d84315">C</text>
  <text x="263" y="104" font-family="serif" font-size="13" fill="#d84315">D</text>
  <!-- Small semicircle cut out (radius h=60, concentric, tangent to CD) -->
  <path d="M 120 170 A 60 60 0 0 1 240 170 Z" fill="#ffffff" stroke="#6a1b9a" stroke-width="2"/>
  <!-- Points A, B, O -->
  <text x="70" y="188" font-family="serif" font-size="13" fill="#1565c0">A</text>
  <text x="276" y="188" font-family="serif" font-size="13" fill="#1565c0">B</text>
  <text x="184" y="186" font-family="serif" font-size="12" fill="#444">O</text>
  <!-- height h annotation -->
  <line x1="180" y1="170" x2="180" y2="110" stroke="#9e9e9e" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="244" y="143" font-family="serif" font-size="12" fill="#555">h</text>
  <!-- half-chord 8 -->
  <text x="128" y="102" font-family="serif" font-size="12" fill="#555">8</text>
  <text x="150" y="70" font-family="serif" font-size="13" fill="#1565c0">R</text>
  <text x="172" y="148" font-family="serif" font-size="12" fill="#6a1b9a">r=h</text>
</svg>
